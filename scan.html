<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สแกนกระดาษคำตอบ · ฮีโร่</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}</style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
<div class="max-w-md mx-auto p-6 text-center">
  <div class="text-5xl mt-10"><i class="fa-solid fa-file-circle-check text-teal-400"></i></div>
  <h1 class="text-2xl font-bold mt-4">สแกนกระดาษคำตอบ</h1>
  <p id="sub" class="text-white/70 mt-2">กำลังเชื่อมต่อกับแอป...</p>
  <button id="go" class="hidden mt-8 w-full bg-teal-600 hover:bg-teal-500 rounded-2xl py-4 text-xl font-bold"><i class="fa-solid fa-camera mr-2"></i>เริ่มสแกน</button>
  <p id="msg" class="text-sm text-amber-300 mt-4"></p>
  <p class="text-xs text-white/50 mt-10 leading-relaxed">หน้านี้ใช้กล้องอ่านกระดาษคำตอบ แล้วส่งผลกลับไปบันทึกในแอปที่เปิดหน้านี้ · ไม่มีการเก็บข้อมูลไว้ในหน้านี้</p>
</div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const OMR = (() => {
      const LABELS = { th: ['ก', 'ข', 'ค', 'ง', 'จ'], en: ['A', 'B', 'C', 'D', 'E'], num: ['1', '2', '3', '4', '5'] };
      const PAGE = { w: 210, h: 297 };
      const FID = [[15, 15], [195, 15], [195, 282], [15, 282]];   // จุดกึ่งกลางสี่เหลี่ยมมุม (มม.)
      const FID_SIZE = 10;
      const BAR = { x: 26, y: 12.5, w: 34, h: 4.5 };               // แถบบอกทิศ (มุมซ้ายบน)
      const R = 2.25;                                              // รัศมีวงคำตอบ
      /** ผังกระดาษของชุดข้อสอบ: ตำแหน่งวงทุกวง (มม.) */
      function layout(e) {
        const digits = e.idMode === 'no' ? 2 : (e.idDigits || 5);
        const idColW = 6.2, idRowH = 5.6;
        const idX0 = 193 - digits * idColW;
        const id = [];
        for (let k = 0; k < digits; k++) {
          const col = [];
          for (let r = 0; r < 10; r++) col.push([idX0 + k * idColW + idColW / 2, 37 + r * idRowH]);
          id.push(col);
        }
        const perCol = 25, rowH = 6.8, colW = 45, choiceW = 6.5;
        const nCols = Math.ceil(e.nQ / perCol);
        const x0 = 15 + (180 - nCols * colW) / 2;
        const y0 = 101;
        const q = [];
        for (let i = 0; i < e.nQ; i++) {
          const c = Math.floor(i / perCol), r = i % perCol;
          const bx = x0 + c * colW + 13;
          const row = [];
          for (let j = 0; j < e.nChoice; j++) row.push([bx + j * choiceW, y0 + r * rowH]);
          q.push({ n: i + 1, numX: bx - 5.5, y: y0 + r * rowH, b: row });
        }
        return { digits, id, idX0, idColW, q, nCols, x0, y0, colW, rowH, perCol, choiceW };
      }

      /* ---------- วาดกระดาษคำตอบ 1 แผ่น (SVG มม.) ---------- */
      function sheetSvg(e, stu) {
        const L = layout(e);
        const lab = LABELS[e.labels] || LABELS.th;
        const t = (x, y, s, size, extra) => `<text x="${x}" y="${y}" font-size="${size}" ${extra || ''}>${esc(s)}</text>`;
        let g = '';
        FID.forEach(([x, y]) => { g += `<rect x="${x - FID_SIZE / 2}" y="${y - FID_SIZE / 2}" width="${FID_SIZE}" height="${FID_SIZE}" fill="#000"/>`; });
        g += `<rect x="${BAR.x}" y="${BAR.y}" width="${BAR.w}" height="${BAR.h}" fill="#000"/>`;
        // หัวกระดาษ
        const hx = 22, hw = L.idX0 - 8 - hx;
        g += t(hx, 27, e.name, 5.2, 'font-weight="700"');
        if (e.subject) g += t(hx, 33, e.subject, 3.4, 'fill="#444"');
        const line = (y, label, val) => {
          g += t(hx, y, label, 3.3, 'fill="#333"');
          g += `<line x1="${hx + 17}" y1="${y + 0.8}" x2="${hx + hw}" y2="${y + 0.8}" stroke="#999" stroke-width="0.25"/>`;
          if (val) g += t(hx + 18, y - 0.4, val, 3.8, 'font-weight="700"');
        };
        line(42, 'ชื่อ-สกุล', stu ? stu.name : '');
        line(50, 'ห้อง', stu ? stu.roomName : '');
        line(58, 'เลขที่', stu ? String(stu.no) : '');
        line(66, e.idMode === 'no' ? 'รหัสชุด' : 'รหัสนักเรียน', stu ? (e.idMode === 'no' ? '' : String(stu.code || '')) : '');
        // คำแนะนำ
        g += `<rect x="${hx}" y="72" width="${hw}" height="17" rx="1.5" fill="#f5f5f5" stroke="#ccc" stroke-width="0.25"/>`;
        g += t(hx + 2, 77, 'ใช้ดินสอ 2B ฝนให้เต็มวง ห้ามฝนเกิน 1 วงต่อข้อ', 3, 'fill="#333"');
        g += t(hx + 2, 82, 'ถ้าเปลี่ยนคำตอบ ลบให้สะอาด · ห้ามพับหรือเขียนทับสี่เหลี่ยมดำ', 3, 'fill="#333"');
        g += t(hx + 2, 87, 'ตัวอย่างฝนถูก', 3, 'fill="#333"');
        g += `<circle cx="${hx + 25}" cy="86" r="1.8" fill="#222"/><circle cx="${hx + 31}" cy="86" r="1.8" fill="none" stroke="#666" stroke-width="0.3"/>`;
        // ช่องรหัส
        const idLabel = e.idMode === 'no' ? 'เลขที่' : 'รหัสนักเรียน';
        g += t(L.idX0 + L.digits * L.idColW / 2, 24.5, idLabel, 3.2, 'text-anchor="middle" font-weight="700"');
        const code = stu ? String(e.idMode === 'no' ? stu.no : (stu.code || '')).replace(/\D/g, '') : '';
        const padded = code ? code.padStart(L.digits, '0').slice(-L.digits) : '';
        L.id.forEach((col, k) => {
          g += `<rect x="${col[0][0] - L.idColW / 2 + 0.4}" y="26.5" width="${L.idColW - 0.8}" height="5.5" fill="none" stroke="#888" stroke-width="0.25"/>`;
          if (padded) g += t(col[0][0], 30.9, padded[k], 3.8, 'text-anchor="middle" font-weight="700"');
          col.forEach(([x, y], r) => {
            const on = padded && Number(padded[k]) === r;
            g += on ? `<circle cx="${x}" cy="${y}" r="${R}" fill="#000"/>`
              : `<circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="#555" stroke-width="0.3"/><text x="${x}" y="${y + 1}" font-size="2.6" text-anchor="middle" fill="#bbb">${r}</text>`;
          });
        });
        // ส่วนคำตอบ
        for (let c = 0; c < L.nCols; c++) {
          const bx = L.x0 + c * L.colW + 13;
          for (let j = 0; j < e.nChoice; j++) g += t(bx + j * L.choiceW, L.y0 - 5, lab[j], 3.2, 'text-anchor="middle" font-weight="700"');
          if (c) g += `<line x1="${L.x0 + c * L.colW + 1}" y1="${L.y0 - 8}" x2="${L.x0 + c * L.colW + 1}" y2="${L.y0 + (L.perCol - 0.5) * L.rowH}" stroke="#ddd" stroke-width="0.25"/>`;
        }
        L.q.forEach(q => {
          if ((q.n - 1) % 5 === 0 && (q.n - 1) % L.perCol) g += `<line x1="${q.numX - 5}" y1="${q.y - L.rowH / 2}" x2="${q.b[q.b.length - 1][0] + 4}" y2="${q.y - L.rowH / 2}" stroke="#e5e5e5" stroke-width="0.25"/>`;
          g += t(q.numX, q.y + 1.2, String(q.n), 3.2, 'text-anchor="end" font-weight="700"');
          q.b.forEach(([x, y], j) => { g += `<circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="#555" stroke-width="0.3"/><text x="${x}" y="${y + 1}" font-size="2.6" text-anchor="middle" fill="#bbb">${lab[j]}</text>`; });
        });
        g += t(22, 291.5, `${e.id || ''} · ${e.nQ} ข้อ${stu ? ` · ${stu.roomName} เลขที่ ${stu.no}` : ''}`, 2.6, 'fill="#999"');
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Sarabun, Tahoma, sans-serif">${g}</svg>`;
      }
      function printSheets(e, students, blankCount) {
        const pages = [];
        (students || []).forEach(s => pages.push(sheetSvg(e, s)));
        for (let k = 0; k < (blankCount || 0); k++) pages.push(sheetSvg(e, null));
        const w = window.open('', '_blank');
        if (!w) return false;
        w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>กระดาษคำตอบ ${esc(e.name)}</title>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap">
          <style>@page{size:A4;margin:0}html,body{margin:0;padding:0}.pg{width:210mm;height:297mm;page-break-after:always;overflow:hidden}.pg:last-child{page-break-after:auto}
          .tip{font-family:Sarabun,Tahoma,sans-serif;background:#fff7ed;border:1px solid #fdba74;padding:10px 14px;margin:10px}@media print{.tip{display:none}}</style></head>
          <body><div class="tip">ตั้งค่าการพิมพ์: กระดาษ A4 · ขนาด 100% (Actual size / ไม่ย่อให้พอดี) · ไม่ต้องพิมพ์หัว-ท้ายกระดาษ · ${pages.length} แผ่น</div>
          ${pages.map(p => `<div class="pg">${p}</div>`).join('')}
          <script>document.fonts && document.fonts.ready.then(function(){setTimeout(function(){window.print();},300);});<\/script></body></html>`);
        w.document.close();
        return true;
      }

      /* ---------- คณิต: homography 4 จุด ---------- */
      function solve(A, b) {
        const n = b.length;
        for (let i = 0; i < n; i++) {
          let p = i;
          for (let k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
          [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
          if (Math.abs(A[i][i]) < 1e-12) return null;
          for (let k = i + 1; k < n; k++) { const f = A[k][i] / A[i][i]; for (let j = i; j < n; j++) A[k][j] -= f * A[i][j]; b[k] -= f * b[i]; }
        }
        const x = new Array(n).fill(0);
        for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let j = i + 1; j < n; j++) s -= A[i][j] * x[j]; x[i] = s / A[i][i]; }
        return x;
      }
      function homography(src, dst) {
        const A = [], b = [];
        for (let i = 0; i < 4; i++) {
          const [x, y] = src[i], [u, v] = dst[i];
          A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
          A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
        }
        const h = solve(A, b);
        if (!h) return null;
        return (x, y) => { const d = h[6] * x + h[7] * y + 1; return [(h[0] * x + h[1] * y + h[2]) / d, (h[3] * x + h[4] * y + h[5]) / d]; };
      }

      /* ---------- อ่านรูป ---------- */
      function loadImage(file) {
        return new Promise((res, rej) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => res({ img, url });
          img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปไม่ได้')); };
          img.src = url;
        });
      }
      function toGray(img, maxSide) {
        const k = Math.min(1, (maxSide || 1600) / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const W = Math.round((img.naturalWidth || img.width) * k), H = Math.round((img.naturalHeight || img.height) * k);
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, W, H);
        const d = ctx.getImageData(0, 0, W, H).data;
        const g = new Uint8ClampedArray(W * H);
        for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000;
        return { g, W, H, canvas: c };
      }
      /** หาสี่เหลี่ยมดำ 4 มุม: threshold แบบปรับตามแสง + connected components */
      function findFiducials(G) {
        const { g, W, H } = G;
        const I = new Float64Array((W + 1) * (H + 1));
        for (let y = 0; y < H; y++) { let s = 0; for (let x = 0; x < W; x++) { s += g[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + s; } }
        const rad = Math.max(8, Math.round(Math.min(W, H) / 14));
        const bin = new Uint8Array(W * H);
        for (let y = 0; y < H; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(H, y + rad + 1);
          for (let x = 0; x < W; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(W, x + rad + 1);
            const sum = I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0];
            const m = sum / ((x1 - x0) * (y1 - y0));
            if (g[y * W + x] < m * 0.78 && g[y * W + x] < 170) bin[y * W + x] = 1;
          }
        }
        const lab = new Int32Array(W * H);
        const comps = [];
        const stack = new Int32Array(W * H);
        let next = 1;
        const minSide = Math.min(W, H) * 0.012;
        for (let p = 0; p < W * H; p++) {
          if (!bin[p] || lab[p]) continue;
          let sp = 0; stack[sp++] = p; lab[p] = next;
          let n = 0, sx = 0, sy = 0, minx = W, maxx = 0, miny = H, maxy = 0;
          while (sp) {
            const q = stack[--sp]; const x = q % W, y = (q / W) | 0;
            n++; sx += x; sy += y;
            if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
            if (x > 0 && bin[q - 1] && !lab[q - 1]) { lab[q - 1] = next; stack[sp++] = q - 1; }
            if (x < W - 1 && bin[q + 1] && !lab[q + 1]) { lab[q + 1] = next; stack[sp++] = q + 1; }
            if (y > 0 && bin[q - W] && !lab[q - W]) { lab[q - W] = next; stack[sp++] = q - W; }
            if (y < H - 1 && bin[q + W] && !lab[q + W]) { lab[q + W] = next; stack[sp++] = q + W; }
          }
          next++;
          const bw = maxx - minx + 1, bh = maxy - miny + 1;
          if (bw < minSide || bh < minSide) continue;
          const asp = bw / bh, fill = n / (bw * bh);
          if (asp < 0.5 || asp > 2 || fill < 0.55) continue;
          // ความเป็นสี่เหลี่ยม: วงกลมมีมุมของกรอบว่าง สี่เหลี่ยมมีมุมเต็ม (แม้เอียงเล็กน้อย)
          comps.push({ x: sx / n, y: sy / n, n, bw, bh, fill });
        }
        if (comps.length < 4) return null;
        comps.sort((a, b) => b.n - a.n);
        const top = comps.slice(0, 14);
        let best = null, bestScore = 0;
        const area = (pts) => { let s = 0; for (let i = 0; i < 4; i++) { const a = pts[i], b = pts[(i + 1) % 4]; s += a.x * b.y - b.x * a.y; } return Math.abs(s) / 2; };
        const order = (pts) => { const cx = pts.reduce((a, p) => a + p.x, 0) / 4, cy = pts.reduce((a, p) => a + p.y, 0) / 4; return pts.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx)); };
        for (let a = 0; a < top.length; a++) for (let b = a + 1; b < top.length; b++) for (let c = b + 1; c < top.length; c++) for (let d = c + 1; d < top.length; d++) {
          const set = [top[a], top[b], top[c], top[d]];
          const ns = set.map(s => s.n), ratio = Math.max(...ns) / Math.min(...ns);
          if (ratio > 3) continue;
          const o = order(set);
          const ar = area(o);
          // จุดต้องกว้างพอ (อย่างน้อย 15% ของรูป) และรูปทรงใกล้สี่เหลี่ยมผืนผ้า
          if (ar < W * H * 0.15) continue;
          const sz = Math.sqrt(ns.reduce((x, y) => x + y, 0) / 4);
          const expected = Math.sqrt(ar / (180 * 267)) * FID_SIZE;           // ขนาดสี่เหลี่ยมที่ควรเป็นเมื่อเทียบกับระยะมุม
          const sizeOk = Math.min(sz, expected) / Math.max(sz, expected);
          if (sizeOk < 0.5) continue;
          const score = ar * sizeOk * sizeOk / ratio;
          if (score > bestScore) { bestScore = score; best = o; }
        }
        return best;
      }
      function sampler(G, map) {
        const { g, W, H } = G;
        const at = (x, y) => { const [u, v] = map(x, y); const xi = Math.round(u), yi = Math.round(v); return xi < 0 || yi < 0 || xi >= W || yi >= H ? 255 : g[yi * W + xi]; };
        /** ค่าเฉลี่ยความสว่างในวง (มม.) */
        const disc = (cx, cy, r0, r1, step) => {
          let s = 0, n = 0;
          for (let dy = -r1; dy <= r1; dy += step) for (let dx = -r1; dx <= r1; dx += step) {
            const d = Math.hypot(dx, dy);
            if (d < r0 || d > r1) continue;
            s += at(cx + dx, cy + dy); n++;
          }
          return n ? s / n : 255;
        };
        const fillAt = (cx, cy) => {
          const inner = disc(cx, cy, 0, R * 0.62, 0.3);
          const ring = disc(cx, cy, R + 0.65, R + 1.0, 0.25);
          return Math.max(0, Math.min(1, 1 - inner / Math.max(ring, 1)));
        };
        const rectFill = (x, y, w, h) => {
          let s = 0, n = 0;
          for (let yy = y + 0.6; yy < y + h - 0.4; yy += 0.5) for (let xx = x + 0.6; xx < x + w - 0.4; xx += 0.8) { s += at(xx, yy); n++; }
          return n ? s / n : 255;
        };
        return { at, fillAt, rectFill };
      }
      /** เลือกคำตอบจากค่าความเข้มของแต่ละวง */
      function pick(fills, th) {
        const T = th || 0.3;
        let mi = -1, mv = 0;
        fills.forEach((f, i) => { if (f > mv) { mv = f; mi = i; } });
        if (mv < T) return { v: '-', conf: 1 - mv / T };
        const marked = fills.filter(f => f >= Math.max(T, mv * 0.6)).length;
        if (marked > 1) return { v: '*', conf: 0 };
        const second = fills.filter((f, i) => i !== mi).reduce((a, b) => Math.max(a, b), 0);
        return { v: String(mi), conf: Math.min(1, (mv - second) / 0.4) };
      }
      /** อ่านกระดาษ 1 รูป → {ok, id, ans, low[], map, rot} */
      function read(G, e) {
        const f = findFiducials(G);
        if (!f) return { ok: false, error: 'หาสี่เหลี่ยมดำ 4 มุมไม่เจอ — ถ่ายให้เห็นมุมกระดาษครบ 4 มุม ไม่มีเงาบัง และไม่เอียงมาก' };
        const L = layout(e);
        let best = null;
        for (let rot = 0; rot < 4; rot++) {
          const dst = [0, 1, 2, 3].map(i => { const p = f[(i + rot) % 4]; return [p.x, p.y]; });
          const map = homography(FID, dst);
          if (!map) continue;
          const S = sampler(G, map);
          const paper = S.rectFill(120, 285.5, 60, 5);            // พื้นที่ว่างตรงข้ามแถบบอกทิศ
          const bar = S.rectFill(BAR.x, BAR.y, BAR.w, BAR.h);
          const score = (paper - bar) / Math.max(paper, 1);
          if (!best || score > best.score) best = { rot, map, S, score };
        }
        if (!best || best.score < 0.25) return { ok: false, error: 'อ่านทิศทางกระดาษไม่ได้ — ตรวจว่าเป็นกระดาษคำตอบของชุดนี้ และแถบดำมุมซ้ายบนไม่ถูกบัง' };
        const S = best.S;
        const low = [];
        const idDigits = L.id.map(col => pick(col.map(([x, y]) => S.fillAt(x, y)), 0.35));
        const ans = L.q.map((q, i) => {
